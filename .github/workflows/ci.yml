name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The build validates env with Zod at module load, so it needs values
    # present. These are placeholders: nothing here reaches a real API.
    env:
      STUDIO_API_URL: http://127.0.0.1:8000
      STUDIO_API_KEY: ci-placeholder-key

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Regenerate from the published contract and fail if it moved. The
      # schema tests check the Zod rules against this file, so a stale copy
      # would let the two sides drift while the suite stayed green.
      - name: Check the API contract is current
        run: |
          pnpm types:api
          git diff --exit-code -- openapi.json src/types/api.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
