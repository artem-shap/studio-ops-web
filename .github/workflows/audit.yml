name: audit

# A dependency can turn vulnerable without a single commit landing here, so
# this runs on a timer as well as on push. Only production dependencies at
# high or critical fail it: a dev-only advisory never reaches a visitor, and
# failing on those would train everyone to ignore a red badge.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
